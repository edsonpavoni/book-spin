<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dark room · Book Spin</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0b0d}
book-spin{display:block;width:min(90vw,560px);aspect-ratio:1}</style>
<!-- Spotlight with the dark backdrop: a pool of light on the wall, a streak on the floor. Gold edges, stops on the cover. -->
<book-spin front="../demo/aph-front.webp" spine="../demo/aph-spine.webp" back="../demo/aph-back.webp"
  pages="280" edge="gold" look="spotlight" backdrop="dark" speed="9" vary="0.6"></book-spin>
<script src="../book-spin.js"></script>
</html>
