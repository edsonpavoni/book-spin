<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Three books · Book Spin</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;font:15px/1.4 system-ui,sans-serif;color:#222}
book-spin{display:block;width:min(90vw,520px);aspect-ratio:1}</style>
<!-- Three books in turn: the covers change on the frame where only the page edges face you.
     Spotlight look, silver edges, 8 s a turn, easing into the front cover. -->
<book-spin front="../demo/book1-front.webp|../demo/book2-front.webp|../demo/book3-front.webp"
  spine="../demo/book1-spine.webp|../demo/book2-spine.webp|../demo/book3-spine.webp"
  back="../demo/book1-back.webp|../demo/book2-back.webp|../demo/book3-back.webp"
  pages="280" edge="silver" look="spotlight" speed="8" vary="0.3" gloss="0.1"></book-spin>
<script src="../book-spin.js"></script>
</html>
